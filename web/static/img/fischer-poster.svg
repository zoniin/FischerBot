<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Bobby Fischer, posterised portrait">
  <!-- Tones: D #1b140e (deep) · W #6f4b33 (walnut shadow) · G #c9a35b (gold halftone) · L #ece3cf (ink light) -->
  <defs>
    <radialGradient id="fbp-bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#d2ad66"/>
      <stop offset="1" stop-color="#b38a46"/>
    </radialGradient>
    <!-- a mask (not a clip) so the stacked tones never fringe at the face edge -->
    <mask id="fbp-face-mask" maskUnits="userSpaceOnUse" x="100" y="40" width="200" height="300">
      <path fill="#fff" d="M200 58 C242 58 271 90 276 130 C279 155 279 182 278 206 C277 230 274 253 269 270 C266 281 260 291 251 299 C241 308 229 320 216 326 C210 328.5 205 329 200 329 C195 329 190 328.5 184 326 C171 320 159 308 149 299 C140 291 134 281 131 270 C126 253 123 230 122 206 C121 182 121 155 124 130 C129 90 158 58 200 58 Z"/>
    </mask>
    <clipPath id="fbp-eye-l-clip"><path d="M154 178.5 C159 172.5 175 170.5 185 180.5 C178 184.5 162 185 154 178.5 Z"/></clipPath>
    <clipPath id="fbp-eye-r-clip"><path d="M246 178.5 C241 172.5 225 170.5 215 180.5 C222 184.5 238 185 246 178.5 Z"/></clipPath>
  </defs>

  <!-- background -->
  <g id="fbp-bg-art">
    <rect width="400" height="400" fill="url(#fbp-bg)"/>
  </g>

  <!-- suit -->
  <g id="fbp-suit">
    <path fill="#1b140e" d="M0 400 L0 350 C40 346 82 341 110 336 C124 333 131 329 136 320 L264 320 C269 329 276 333 290 336 C318 341 360 346 400 350 L400 400 Z"/>
    <!-- lit shoulder -->
    <path fill="#6f4b33" d="M0 350 C40 346 82 341 110 336 C120 334 126 331 131 326 C127 334 120 339 110 342 C82 348 40 353 0 357 Z"/>
    <!-- lapel edges catching the light: collar, notch, lapel -->
    <path fill="#6f4b33" d="M128.5 336.5 L126 334.5 L98.5 367.5 L101 369.500 Z M99 369 L100.5 366.5 L116 376 L114.500 378.500 Z M115.500 375.500 L115.5 378.5 L84 380 L84 377 Z M83 378 L86.500 377 L102.500 400 L98.5 400 Z"/>
  </g>

  <!-- neck -->
  <g id="fbp-neck">
    <path fill="#ece3cf" d="M144 268 L144 316 C144 325 142 331 140 337 L200 364 L260 337 C258 331 256 325 256 316 L256 268 Z"/>
    <!-- shadow of the jaw: halftone, shadow, core -->
    <path fill="#c9a35b" d="M148 268 L148 296 C150 312 156 326 165 340 L200 364 L254 340 L250 268 Z"/>
    <path fill="#6f4b33" d="M160 300 C176 320 198 340 218 357 L260 337 C258 331 256 325 256 316 L256 268 L160 268 Z"/>
    <path fill="#1b140e" d="M180 314 C196 330 214 344 240 350 L257.500 338 C255.5 331 253.500 325 253.5 316 L253.5 268 L180 268 Z"/>
  </g>

  <!-- shirt, collar, tie -->
  <g id="fbp-shirt">
    <!-- shirt front (in the shadow of collar and tie) -->
    <path fill="#c9a35b" d="M150 340 L250 340 L236 400 L164 400 Z"/>
    <!-- tie -->
    <path fill="#1b140e" d="M189 353 L211 353 L207 371 L214 400 L186 400 L193 371 Z"/>
    <path fill="#6f4b33" d="M189 353 L195 353 L196 371 L192 400 L186 400 L193 371 Z"/>
    <!-- collar leaves -->
    <path fill="#ece3cf" d="M141 316 C156 332 178 346 197 353 L178 386 L130 342 Z"/>
    <path fill="#ece3cf" d="M259 316 C244 332 222 346 203 353 L222 386 L270 342 Z"/>
    <!-- chin shadow on the far leaf -->
    <path fill="#c9a35b" d="M259 316 C244 332 222 346 203 353 L210 366 C228 360 248 350 266 334 Z"/>
    <!-- lapels over the shirt -->
    <path fill="#1b140e" d="M138 317 L112 344 L140 400 L170 400 Z"/>
    <path fill="#1b140e" d="M262 317 L288 344 L260 400 L230 400 Z"/>
  </g>

  <g id="fbp-head" transform="rotate(-3 200 322)">
    <!-- ears -->
    <g id="fbp-ears">
      <path fill="#ece3cf" d="M126 172 C112 164 102 175 103 195 C104 215 110 233 120 241 C126 245 131 237 129 227 Z"/>
      <path fill="#6f4b33" d="M121 196 C114 194 110 198 111 205 C112 215 116 224 121 229 C118 221 116 212 117 205 C117 201 119 198 121 196 Z"/>
      <path fill="#6f4b33" d="M274 172 C288 164 298 175 297 195 C296 215 290 233 280 241 C274 245 269 237 271 227 Z"/>
      <path fill="#1b140e" d="M279 196 C286 194 290 198 289 205 C288 215 284 224 279 229 C282 221 284 212 283 205 C283 201 281 198 279 196 Z"/>
    </g>

    <!-- face: light base, then halftone, shadow, accents (all masked to the face shape) -->
    <g id="fbp-face" mask="url(#fbp-face-mask)">
      <rect x="110" y="40" width="180" height="300" fill="#ece3cf"/>
      <!-- gold halftone (terminator band) -->
      <path fill="#c9a35b" d="M225 40 C223 84 223 122 226 144 L210 154 L207 167 L207 225 C209 231 209 238 206 244 L197 249 C203 256 209 259 214 263 C216 272 215 284 213 295 C211 307 207 319 200 331 L290 332 L290 40 Z"/>
      <!-- hair shadow on the forehead -->
      <path fill="#c9a35b" d="M146 124 L152 138 C155 128 160 120 168 114 C180 104 195 98 210 95 C223 92 236 87 245 78 L246 60 L146 60 Z"/>
      <!-- crease from nose wing toward the mouth corner, lit side -->
      <path fill="#c9a35b" d="M175 249 C170.500 254 167 259.500 165 265 C169.500 260.500 173.500 256 177.500 251.500 Z"/>
      <!-- walnut shadow side -->
      <path fill="#6f4b33" d="M238 40 C236 84 236 122 238 146 L216 158 L207 167 L207 225 C209 231 209 238 206 244 L199 248 C206 253 214 255 222 260 C224 270 223 282 221 294 C219 306 214 318 207 331 L290 332 L290 40 Z"/>
      <!-- lit patch on the far cheek -->
      <path fill="#c9a35b" d="M221 198 C231 201 244 199 255 194 C255 207 251 222 241 236 C232 224 225 211 221 198 Z"/>
      <!-- sockets: shadow between brow and lid -->
      <path fill="#6f4b33" d="M190 167 C178 161 166 159 153 159.5 C156 163 159 167 163 171.5 C170 169.5 180 172.5 187 182 C190 177 191 172 190 167 Z"/>
      <path fill="#1b140e" d="M210 167 C222 161 240 158 258 159 C257 167 253 174 248 180 C243 170 224 168 213 182 C210 177 209 172 210 167 Z"/>
      <!-- nose: core shadow down the far side of the ridge, underside, wings -->
      <path fill="#1b140e" d="M207 167 L207 225 C209 231 209 238 206 244 L214 242 C216.5 234 215 223 214 213 C213 199 213 187 215 177 L217 163 Z"/>
      <path fill="#1b140e" d="M186.5 243.5 C188.5 241 192 241 194.5 243 C196.5 244.8 198.5 246.5 200.5 246.5 C202.5 246.5 204.5 245.5 206 244 L214 242 C216.5 243 217.5 245 217.5 247 C214.5 250 210 251 206 250.5 C203.5 250.3 201.5 249.6 200 249 C197 249.5 193.5 249 190.5 247.8 C188.5 246.8 187 245.3 186.5 243.5 Z"/>
      <path fill="#c9a35b" d="M180.500 229 C175.500 234 175.500 242 181 246 C179 241 179 235 182 230.5 Z"/>
      <path fill="#1b140e" d="M218 231 C222.500 235 223 242 219.500 246.500 C220.500 241.500 220 236 217.500 232.500 Z"/>
    </g>

    <!-- hair -->
    <g id="fbp-hair">
      <path fill="#1b140e" d="M124.500 207 L129.500 202 C130.5 190 129.500 176 130 162 C130.5 146 132 130 136 116 C140 121 145 126 149 130 C151 121 156 113 164 107 C176 97 192 91 208 88 C221 85 233 80 241 72 L247 76 C258 87 267 104 270 124 C271.5 138 271 151 270 162 C269.500 176 269.500 190 270.5 202 L275.500 207 C276.500 203 277 199 277.5 195 L287 191 C288.500 186 287.500 180 288.5 173 C291 157 292.500 139 291.5 121 C289 94 281 68 266 48 C261 42 257 38 253 35 L248 39 C241 27 228 16 212 12.5 C200 10 188 10 177 13 C155 14 132 30 119 54 C110 72 107 97 107 118 L109.500 121 C109.500 140 110.500 158 113 173 C114 180 112.500 186 113.5 191 L123 195 C123.5 199 124 203 124.500 207 Z"/>
      <!-- highlights fanning out from the parting -->
      <path fill="#6f4b33" d="M244 45 C228 33 206 27 184 29 C160 32 140 46 127 67 C120 79 116 93 114 108 C121 93 130 79 142 67 C157 50 180 38.5 203 37 C218 36.5 232 40 244 45 Z"/>
      <path fill="#6f4b33" d="M214 48.5 C198 47 182 50 168 57 C154 65 143 78 136 93 C144 82 154 72 166 65.5 C181 57.5 198 53.5 214 48.5 Z"/>
      <path fill="#6f4b33" d="M239 64 C227 59 212 60 198 63 C181 68 166 78 157 91 C152 98 149 107 148 116 C154 106 160 98 169 91 C181 82 197 77 212 75 C223 73.5 233 70 239 64 Z"/>
      <path fill="#1b140e" d="M230 67.500 C214 67.500 196 72 182 80 C174 85 168 90 163 97 C169 92 176 87 184 83 C198 75.500 214 71 230 67.5 Z"/>
      <path fill="#6f4b33" d="M113 128 C111.5 143 113 158 116.5 174 C117 162 117.5 149 119.5 138 C120.5 132 118 129.5 113 128 Z"/>
      <path fill="#6f4b33" d="M256 46 C271 58 281 78 285.5 104 C277 86 268 70 254 56 Z"/>
      <path fill="#6f4b33" d="M254 66 C262 76 267 90 269 106 C264 94 259 84 252 74 Z"/>
      <path fill="#c9a35b" d="M200 31.5 C182 31 164 37 150 49 C165 40.5 182 35.5 200 31.5 Z"/>
      <!-- the parting -->
      <path fill="#c9a35b" d="M241.5 71 L246.5 75 L252 46 Z"/>
    </g>

    <!-- eyebrows -->
    <g id="fbp-brows" fill="#1b140e">
      <path d="M189 158.5 C178 154 161 152.5 148 154.5 L142 159.5 C153 161 170 162.5 187 170 C190 166 190 162 189 158.5 Z"/>
      <path d="M211 158.5 C222 154 239 152.5 252 154.5 L258 159.5 C247 161 230 162.5 213 170 C210 166 210 162 211 158.5 Z"/>
    </g>

    <!-- eyes -->
    <g id="fbp-eyes">
      <g id="fbp-eye-l">
        <path fill="#ece3cf" d="M154 178.5 C159 172.5 175 170.5 185 180.5 C178 184.5 162 185 154 178.5 Z"/>
        <circle clip-path="url(#fbp-eye-l-clip)" cx="169.5" cy="177" r="6.6" fill="#1b140e"/>
        <circle cx="167.3" cy="175" r="1.5" fill="#ece3cf"/>
        <path fill="#1b140e" d="M152 180 C157 170 176 168 187 182 L185 180.5 C175 170.5 159 172.5 154 178.5 Z"/>
        <path fill="#c9a35b" d="M156 180.5 C162 185.5 178 185 183.5 182 C178 187.5 162 188 156 180.5 Z"/>
      </g>
      <g id="fbp-eye-r">
        <path fill="#c9a35b" d="M246 178.5 C241 172.5 225 170.5 215 180.5 C222 184.5 238 185 246 178.5 Z"/>
        <circle clip-path="url(#fbp-eye-r-clip)" cx="230.5" cy="177" r="6.6" fill="#1b140e"/>
        <circle cx="228.3" cy="175" r="1.4" fill="#ece3cf"/>
        <path fill="#1b140e" d="M248 180 C243 170 224 168 213 182 L215 180.5 C225 170.5 241 172.5 246 178.5 Z"/>
        <path fill="#1b140e" d="M244 180.5 C238 185.5 222 185 216.5 182 C222 187.5 238 188 244 180.5 Z"/>
      </g>
    </g>

    <!-- mouth -->
    <g id="fbp-mouth" transform="translate(0 3.5)">
      <!-- upper lip (thin) -->
      <path fill="#6f4b33" d="M168 269 C180 265.5 190 264 195 264 L200 265.5 L205 264 C210 264 220 265.5 232 269 C220 270 210 270.4 200 270.8 C190 270.4 180 270 168 269 Z"/>
      <!-- line between the lips -->
      <path fill="#1b140e" d="M164 269.5 C176 268.5 190 269.2 200 270 C210 269.2 224 268.5 236 269.5 C224 272.5 210 272.8 200 273.2 C190 272.8 176 272.5 164 269.5 Z"/>
      <!-- corner tucks -->
      <path fill="#6f4b33" d="M164.500 269.5 L160.5 268 L161.8 272 Z"/>
      <path fill="#1b140e" d="M235.500 269.5 L239.5 268 L238.2 272 Z"/>
      <!-- under the lower lip -->
      <path fill="#6f4b33" d="M186 283.5 C194 287.5 208 287.5 216 283.5 C215 289.5 209 293.5 201 293.5 C193 293.5 187 289.5 186 283.5 Z"/>
    </g>
  </g>
</svg>
